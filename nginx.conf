server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión: mejora LCP y Core Web Vitals (factor de ranking)
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/xml
    application/manifest+json
    image/svg+xml;

  # ───────────────────────────────────────────────────────
  # Archivos de SEO y GEO: se sirven tal cual, con el
  # Content-Type correcto y SIN pasar por el fallback SPA.
  # Sin esta regla, un 404 devolvería index.html (HTML) en
  # lugar de un 404 real, y los rastreadores interpretarían
  # robots.txt o sitemap.xml como contenido inválido.
  # ───────────────────────────────────────────────────────
  location = /robots.txt {
    add_header Content-Type "text/plain; charset=utf-8";
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /sitemap.xml {
    add_header Content-Type "application/xml; charset=utf-8";
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # llms.txt y llms-full.txt — consumidos por rastreadores de IA
  location ~ ^/llms(-full)?\.txt$ {
    add_header Content-Type "text/plain; charset=utf-8";
    add_header Cache-Control "public, max-age=86400";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Content-Type "application/manifest+json; charset=utf-8";
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # ───────────────────────────────────────────────────────
  # Activos con hash en el nombre: caché agresiva permanente
  # ───────────────────────────────────────────────────────
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Imágenes: caché larga (son estáticas y versionadas por nombre)
  location /imgs/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # ───────────────────────────────────────────────────────
  # Cabeceras de seguridad (señal de calidad / confianza)
  # ───────────────────────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ───────────────────────────────────────────────────────
  # Fallback SPA: el HTML nunca se cachea, para que los
  # despliegues se reflejen de inmediato.
  # ───────────────────────────────────────────────────────
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
