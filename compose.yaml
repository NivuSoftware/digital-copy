services:
  app:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
